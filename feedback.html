
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body>
    <h1>Feedback Form</h1>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="grades.html">Grades</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <hr>

    <main>
        <h2>Share Your Feedback</h2>
        <p>Please fill in the form below to share your thoughts about the courses and the portal.</p>

        <form>
            <fieldset>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
            <br><br>

            <label for="course">Select Course:</label><br>
            <select name="course" id="course">
                <option value="">Choose a course</option>
                <option value="html">HTML & Web Fundamentals</option>
                <option value="css">CSS & Responsive Design</option>
                <option value="javascript">JavaScript</option>
                <option value="dbms">Database Management System</option>
            </select>
            <br><br>

            <label for="feedback">Your Feedback:</label><br>
            <textarea name="feedback" id="feedback" rows="5" cols="30"></textarea>
            <br><br>

            <label for="rating">Rate the Portal:</label><br>
            <select name="rating" id="rating">
                <option value="5">Excellent</option>
                <option value="4">Good</option>
                <option value="3">Okay</option>
                <option value="2">Bad</option>
                <option value="1">Very Bad</option>
            </select>
            <br><br>

            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to the newsletter and updates</label>
            <br><br>

            <button type="submit">Submit Feedback</button>
            <button type="reset">Reset</button>
            </fieldset>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>
</body>
</html>
